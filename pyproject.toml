[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time destination-dispatch elevator simulation with pluggable dispatch and motion policies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the core has no runtime dependencies

[dependency-groups]
# `uv sync` installs this group by default; with pip >= 25.1: `pip install --group dev`.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.scripts]
elevator-sim = "elevator_sim.__main__:main"

[tool.setuptools]
packages = ["elevator_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["elevator_sim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade (to the 3.10 floor)
    "SIM",     # simplify
    "RUF",     # ruff-specific
]
